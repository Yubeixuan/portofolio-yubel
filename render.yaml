services:
  - type: web
    name: portofolio-yubel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Isi manual di dashboard Render dengan hasil: php artisan key:generate --show
      # (formatnya harus "base64:..."; generateValue dari Render tidak valid untuk Laravel).
      # Jika dikosongkan, Dockerfile membuat kunci sementara saat start.
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
